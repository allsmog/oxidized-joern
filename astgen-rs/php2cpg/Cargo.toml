[workspace]
members = [
  "crates/phpastgen-cli",
  "crates/phpastgen-core",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
serde_json = "1.0"
tempfile = "3.14"
tree-sitter = "0.25"
tree-sitter-php = "0.24.2"
