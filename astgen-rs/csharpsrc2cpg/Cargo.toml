[workspace]
members = [
  "crates/dotnetastgen-cli",
  "crates/dotnetastgen-core",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
regex = "1.11"
quick-xml = "0.41"
serde_json = "1.0"
tempfile = "3.14"
tree-sitter = "0.26"
tree-sitter-c-sharp = "0.23.5"
