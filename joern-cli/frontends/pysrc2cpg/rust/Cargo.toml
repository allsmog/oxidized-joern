[workspace]
members = [
  "crates/pyastgen-cli",
  "crates/pyastgen-core",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
regex = "1"
rustpython-parser = { version = "0.4.0", features = ["all-nodes-with-ranges"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
