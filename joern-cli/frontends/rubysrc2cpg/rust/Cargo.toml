[workspace]
members = [
  "crates/rubyastgen-cli",
  "crates/rubyastgen-core",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
lib-ruby-parser = "4.0.6"
serde_json = "1.0"
tempfile = "3.14"
