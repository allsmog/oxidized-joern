[workspace]
members = [
  "crates/rustastgen-cli",
  "crates/rustastgen-core",
]
exclude = ["fixtures/rust-corpus"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.8.1"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
ra_ap_syntax = "0.0.337"
# rust-analyzer HIR stack, pinned to the same family version as ra_ap_syntax.
# Used (behind the sysroot flag) for real type/method resolution; the heuristic
# SemanticModel remains the fallback when HIR yields nothing.
ra_ap_hir = "=0.0.337"
ra_ap_ide_db = "=0.0.337"
ra_ap_load-cargo = "=0.0.337"
ra_ap_paths = "=0.0.337"
ra_ap_project_model = "=0.0.337"
ra_ap_vfs = "=0.0.337"
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
