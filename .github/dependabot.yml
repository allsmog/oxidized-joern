version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /cpg-rs
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /oxidized
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /astgen-rs/abap2cpg
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /astgen-rs/csharpsrc2cpg
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /astgen-rs/javasrc2cpg
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /astgen-rs/jimple2cpg
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /astgen-rs/kotlin2cpg
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /astgen-rs/php2cpg
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /astgen-rs/swiftsrc2cpg
    schedule:
      interval: weekly
    # tree-sitter 0.26 changes malformed-Swift recovery shapes and currently
    # breaks the SwiftSyntax compatibility contract. Keep the tested 0.25 line
    # until the adapter has an explicit parser-runtime migration.
    ignore:
      - dependency-name: tree-sitter
        versions: [">= 0.26.0"]
    groups:
      rust-dependencies:
        patterns: ["*"]
