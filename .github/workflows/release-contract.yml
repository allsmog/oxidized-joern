name: Rust release contract

on:
  push:
    branches: [master, main]
    paths:
      - cpg-install.sh
      - cpg-rs/**
      - ci/Dockerfile
      - .dockerignore
      - .github/workflows/release.yml
      - .github/workflows/release-contract.yml
  pull_request:
    paths:
      - cpg-install.sh
      - cpg-rs/**
      - ci/Dockerfile
      - .dockerignore
      - .github/workflows/release.yml
      - .github/workflows/release-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # 1.97.0
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: cpg-rs
          key: linux-release-contract
      - name: Validate installer syntax
        run: sh -n cpg-install.sh
      - name: Build the release binary
        working-directory: cpg-rs
        run: cargo build --release --locked -p cpg-cli
      - name: Package and smoke-test the archive
        run: |
          version="$(sed -n 's/^version = "\([0-9][0-9.]*\)"$/\1/p' cpg-rs/Cargo.toml)"
          python cpg-rs/scripts/package-release.py \
            --binary cpg-rs/target/release/cpg \
            --output ci \
            --platform linux-amd64 \
            --version "${version}"
          (cd ci && sha256sum --check oxidized-joern-cpg-linux-amd64.tar.gz.sha256)
      - name: Build and smoke-test the container
        run: |
          docker build --file ci/Dockerfile --tag oxidized-joern-cpg:contract .
          docker run --rm oxidized-joern-cpg:contract --version
