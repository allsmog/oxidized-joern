name: Temporary Swift Dependabot diagnostics

on:
  push:
    branches:
      - dependabot/cargo/joern-cli/frontends/swiftsrc2cpg/rust/rust-dependencies-95b314499e

permissions:
  contents: read

jobs:
  inspect-recovery-helpers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Print relevant Swift recovery helpers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("joern-cli/frontends/swiftsrc2cpg/rust/crates/swiftastgen-core/src/lib.rs")
          lines = path.read_text().splitlines()
          needles = [
              "fn source_file(",
              "fn recovered_split_nested_nominal_decl(",
              "fn is_recoverable_function_error(",
              "fn recovered_function_error_decls(",
              "fn function_line_ranges(",
              "fn recovered_property_initializer(",
              "fn is_recoverable_do_error(",
              "fn recovered_do_syntax_from_error(",
              "fn recovered_do_expr_from_error(",
              "fn skip_do_cast_artifacts(",
              "fn is_do_cast_artifact_start(",
          ]
          for needle in needles:
              matches = [index for index, line in enumerate(lines) if needle in line]
              print(f"\n===== {needle} matches={matches} =====")
              for index in matches:
                  start = max(0, index - 20)
                  end = min(len(lines), index + 140)
                  for line_number in range(start, end):
                      print(f"{line_number + 1:05d}: {lines[line_number]}")
          PY
