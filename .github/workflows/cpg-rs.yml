name: cpg-rs

on:
  push:
    paths:
      - 'cpg-rs/**'
      - '.github/workflows/cpg-rs.yml'
  pull_request:
    paths:
      - 'cpg-rs/**'
      - '.github/workflows/cpg-rs.yml'
  workflow_dispatch:

env:
  # Byte-parity spec is pinned to this Joern release (see cpg-rs/PROGRESS.md).
  # Keep in sync with the default in cpg-rs/joern-parity/setup-oracle.sh.
  JOERN_VERSION: v4.0.555

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cpg-rs
      - name: Build
        run: cargo build --workspace --locked
        working-directory: cpg-rs
      - name: Test
        run: cargo test --workspace --locked
        working-directory: cpg-rs

  fmt-clippy:
    runs-on: ubuntu-latest
    # The tree does not currently pass fmt/clippy (223 rustfmt diffs, 6 clippy
    # warnings in joern-parity as of 2026-07-09). Advisory until cleaned up;
    # drop continue-on-error once the workspace is clean.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cpg-rs
      - name: rustfmt
        run: cargo fmt --check
        working-directory: cpg-rs
      - name: clippy
        run: cargo clippy --workspace -- -D warnings
        working-directory: cpg-rs

  # Repository-local, one-day validation artifacts for the exact pinned engine.
  # The workflow itself lives on current master so the PR is mergeable, while
  # checkout is locked to the dependency revision named in Cargo.toml.
  export-pinned-cpg-snapshot:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b24a355995f1f1085a7a523f46f93f02cb70e1f8
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@1.96.1
      - name: Resolve the exact CPG dependency graph
        run: cargo fetch --locked
        working-directory: cpg-rs
      - name: Archive exact cpg-rs source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "b24a355995f1f1085a7a523f46f93f02cb70e1f8"
          test -f cpg-rs/Cargo.toml
          tar --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -czf "${RUNNER_TEMP}/oxidized-joern-cpg-rs-b24a3559.tar.gz" \
            cpg-rs
          sha256sum "${RUNNER_TEMP}/oxidized-joern-cpg-rs-b24a3559.tar.gz" \
            | tee "${RUNNER_TEMP}/oxidized-joern-cpg-rs-b24a3559.tar.gz.sha256"
      - name: Archive offline CPG Cargo cache
        run: |
          set -euo pipefail
          cargo_home="${CARGO_HOME:-${HOME}/.cargo}"
          staging="${RUNNER_TEMP}/oxidized-offline-cargo"
          mkdir -p "${staging}/cargo-home"
          for directory in registry git; do
            if [[ -d "${cargo_home}/${directory}" ]]; then
              cp -a "${cargo_home}/${directory}" "${staging}/cargo-home/${directory}"
            fi
          done
          archive="${RUNNER_TEMP}/oxidized-joern-cpg-rs-offline-b24a3559.tar.gz"
          tar --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -czf "${archive}" \
            -C "${staging}" .
          sha256sum "${archive}" | tee "${archive}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: oxidized-joern-cpg-rs-b24a3559
          path: |
            ${{ runner.temp }}/oxidized-joern-cpg-rs-b24a3559.tar.gz
            ${{ runner.temp }}/oxidized-joern-cpg-rs-b24a3559.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: oxidized-joern-cpg-rs-offline-b24a3559
          path: |
            ${{ runner.temp }}/oxidized-joern-cpg-rs-offline-b24a3559.tar.gz
            ${{ runner.temp }}/oxidized-joern-cpg-rs-offline-b24a3559.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  # Differential parity against the pinned Joern oracle. The oracle download
  # is ~2GB, so this job is manual-only (workflow_dispatch) rather than
  # running on every push. The unpacked distribution is cached keyed on the
  # pinned version.
  parity:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cpg-rs
      - name: Set up JDK (Joern needs a JVM)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Joern oracle
        uses: actions/cache@v4
        with:
          path: /tmp/joern-cli-dist
          key: joern-oracle-${{ env.JOERN_VERSION }}
      - name: Install Joern oracle
        run: ./cpg-rs/joern-parity/setup-oracle.sh
      - name: Run parity check
        run: ./check.sh
        working-directory: cpg-rs/joern-parity
