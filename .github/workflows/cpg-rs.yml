name: Rust core

on:
  push:
    paths:
      - 'cpg-rs/**'
      - 'oxidized/**'
      - '.github/workflows/cpg-rs.yml'
  pull_request:
    paths:
      - 'cpg-rs/**'
      - 'oxidized/**'
      - '.github/workflows/cpg-rs.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Byte-parity spec is pinned to this Joern release (see cpg-rs/PROGRESS.md).
  # Keep in sync with the default in cpg-rs/joern-parity/setup-oracle.sh.
  JOERN_VERSION: v4.0.555

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        workspace: [cpg-rs, oxidized]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ${{ matrix.workspace }}
      - name: Build
        run: cargo build --workspace --locked
        working-directory: ${{ matrix.workspace }}
      - name: Test
        run: cargo test --workspace --locked
        working-directory: ${{ matrix.workspace }}

  fmt-clippy:
    strategy:
      fail-fast: false
      matrix:
        workspace: [cpg-rs, oxidized]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ${{ matrix.workspace }}
      - name: rustfmt
        run: cargo fmt --all --check
        working-directory: ${{ matrix.workspace }}
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
        working-directory: ${{ matrix.workspace }}

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.0
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit locked dependencies
        run: |
          cargo audit --deny warnings --file cpg-rs/Cargo.lock
          cargo audit --deny warnings --no-fetch --file oxidized/Cargo.lock

  # Fast differential parity against the committed oracle. This mode cannot
  # regenerate the reference even if a Joern distribution happens to exist on
  # the runner, so it is safe to run on every event handled by this workflow.
  committed-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: cpg-rs
      - name: Check committed Joern parity
        run: ./check.sh --committed-only
        working-directory: cpg-rs/joern-parity
      - name: Check committed cross-language frontend parity
        run: ./acceptance/languages/check.sh --committed-only
        working-directory: cpg-rs
      - name: Check complete committed CPGQL contract
        run: ./acceptance/cpgql/check.sh --committed-only
        working-directory: cpg-rs
      - name: Check canonical C security outcomes
        run: cargo test -p cpg-analysis --test canonical_c_flow --locked
        working-directory: cpg-rs
      - name: Check labeled C rule precision and recall
        run: cargo test -p cpg-cli --test rule_quality --locked
        working-directory: cpg-rs
      - name: Check promoted-language rule precision and recall
        run: cargo test -p cpg-cli --test language_rule_quality --locked
        working-directory: cpg-rs
      - name: Check every accepted language workflow
        run: |
          cargo test -p conformance --locked all_languages_conform
          cargo test -p cpg-incremental --locked taint_through_summary_in_every_language
        working-directory: cpg-rs

  # Regenerating the differential oracle downloads ~2GB of pinned Joern, so
  # keep integrity regeneration as a separate manual operation.
  oracle-integrity:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: cpg-rs
      - name: Set up JDK (Joern needs a JVM)
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Joern oracle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/joern-cli-dist
          key: joern-oracle-${{ env.JOERN_VERSION }}
      - name: Install Joern oracle
        run: ./cpg-rs/joern-parity/setup-oracle.sh
      - name: Run parity check
        run: ./check.sh
        working-directory: cpg-rs/joern-parity
      - name: Run native CPGQL differential
        run: ./acceptance/cpgql/check.sh
        working-directory: cpg-rs
      - name: Run cross-language frontend differential
        run: ./acceptance/languages/check.sh
        working-directory: cpg-rs
      - name: Run C compiler-input differential
        run: ./acceptance/c-semantics/check.sh
        working-directory: cpg-rs
      - name: Run Flatgraph interoperability differential
        run: ./acceptance/flatgraph/check.sh
        working-directory: cpg-rs

  real-language-projects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # 1.97.0
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: cpg-rs
          key: linux-real-language-projects
      - name: Build production CLI
        run: cargo build --release --locked -p cpg-cli
        working-directory: cpg-rs
      - name: Validate 16 pinned non-C projects
        run: ./scripts/language-project-acceptance.py
        working-directory: cpg-rs
