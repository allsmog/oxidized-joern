name: Rust core

on:
  push:
    paths:
      - 'cpg-rs/**'
      - 'oxidized/**'
      - '.github/workflows/cpg-rs.yml'
  pull_request:
    paths:
      - 'cpg-rs/**'
      - 'oxidized/**'
      - '.github/workflows/cpg-rs.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Byte-parity spec is pinned to this Joern release (see cpg-rs/PROGRESS.md).
  # Keep in sync with the default in cpg-rs/joern-parity/setup-oracle.sh.
  JOERN_VERSION: v4.0.555

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        workspace: [cpg-rs, oxidized]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ${{ matrix.workspace }}
      - name: Build
        run: cargo build --workspace --locked
        working-directory: ${{ matrix.workspace }}
      - name: Test
        run: cargo test --workspace --locked
        working-directory: ${{ matrix.workspace }}

  fmt-clippy:
    strategy:
      fail-fast: false
      matrix:
        workspace: [cpg-rs, oxidized]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ${{ matrix.workspace }}
      - name: rustfmt
        run: cargo fmt --all --check
        working-directory: ${{ matrix.workspace }}
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
        working-directory: ${{ matrix.workspace }}

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.0
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit locked dependencies
        run: |
          cargo audit --deny warnings --file cpg-rs/Cargo.lock
          cargo audit --deny warnings --no-fetch --file oxidized/Cargo.lock

  # Differential parity against the pinned Joern oracle. The oracle download
  # is ~2GB, so this job is manual-only (workflow_dispatch) rather than
  # running on every push. The unpacked distribution is cached keyed on the
  # pinned version.
  parity:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: cpg-rs
      - name: Set up JDK (Joern needs a JVM)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Joern oracle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/joern-cli-dist
          key: joern-oracle-${{ env.JOERN_VERSION }}
      - name: Install Joern oracle
        run: ./cpg-rs/joern-parity/setup-oracle.sh
      - name: Run parity check
        run: ./check.sh
        working-directory: cpg-rs/joern-parity
