name: C real-project acceptance

on:
  schedule:
    - cron: '19 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-projects:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # 1.97.0
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: cpg-rs
          key: linux-nightly-real-c-projects
      - name: Build production C acceptance binaries
        working-directory: cpg-rs
        run: cargo build --release --locked -p cpg-cli -p joern-parity
      - name: Validate pinned zlib and Lua workflows
        working-directory: cpg-rs
        run: ./scripts/real-project-acceptance.py
