name: Rust-native release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: version
        name: Match the tag to the Cargo version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tags must use the form vMAJOR.MINOR.PATCH"
            exit 1
          fi
          version="$(sed -n 's/^version = "\([0-9][0-9.]*\)"$/\1/p' cpg-rs/Cargo.toml)"
          if [[ "${RELEASE_TAG}" != "v${version}" ]]; then
            echo "::error::tag ${RELEASE_TAG} does not match cpg-rs version ${version}"
            exit 1
          fi
          echo "value=${version}" >> "${GITHUB_OUTPUT}"
      - name: Require the tag commit to be on the default branch
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          default_ref="refs/remotes/origin/${DEFAULT_BRANCH}"
          if ! git show-ref --verify --quiet "${default_ref}"; then
            git fetch --no-tags origin "+refs/heads/${DEFAULT_BRANCH}:${default_ref}"
          fi
          tag_commit="$(git rev-parse "${TAG_SHA}^{commit}")"
          if ! git merge-base --is-ancestor "${tag_commit}" "${default_ref}"; then
            echo "::error::tag commit ${tag_commit} is not reachable from origin/${DEFAULT_BRANCH}"
            exit 1
          fi

  rust:
    needs: validate-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # 1.97.0
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: cpg-rs
      - name: Check, lint, and test the released workspace
        working-directory: cpg-rs
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit the released dependency graph
        run: cargo audit --deny warnings --file cpg-rs/Cargo.lock
      - name: Check the committed Joern parity contract
        working-directory: cpg-rs/joern-parity
        run: ./check.sh --committed-only

  build:
    needs: [validate-tag, rust]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux-amd64
            binary-suffix: ""
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64
            binary-suffix: ""
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-amd64
            binary-suffix: ""
          - runner: macos-15
            target: aarch64-apple-darwin
            platform: macos-arm64
            binary-suffix: ""
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-amd64
            binary-suffix: .exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # 1.97.0
        with:
          toolchain: 1.97.0
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: cpg-rs
          key: ${{ matrix.target }}-release
      - name: Build the Rust-native CLI
        working-directory: cpg-rs
        run: cargo build --release --locked -p cpg-cli --target ${{ matrix.target }}
      - name: Package and acceptance-test the release asset
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          python cpg-rs/scripts/package-release.py \
            --binary "cpg-rs/target/${{ matrix.target }}/release/cpg${{ matrix.binary-suffix }}" \
            --output release \
            --platform "${{ matrix.platform }}" \
            --version "${RELEASE_VERSION}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-native-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error

  publish:
    if: github.repository == 'allsmog/oxidized-joern'
    needs: [validate-tag, rust, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rust-native-*
          path: release
          merge-multiple: true
      - name: Verify staged checksums
        working-directory: release
        run: sha256sum --check ./*.sha256
      - name: Attest release assets
        if: github.repository_visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            cpg-install.sh
            release/*.tar.gz
            release/*.zip
      - name: Publish preview release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Oxidized Joern cpg ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Rust-native preview release of the `cpg` command-line tool.

            Each archive contains only the `cpg` executable, its license, and the current compatibility notes. This preview does not claim full Joern compatibility.
          files: |
            cpg-install.sh
            release/*

  container:
    if: github.repository == 'allsmog/oxidized-joern'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rust-native-linux-*
          path: ci
          merge-multiple: true
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=preview
            type=sha
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ci/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=release-container
          cache-to: type=gha,mode=max,scope=release-container
          provenance: mode=max
          sbom: true
