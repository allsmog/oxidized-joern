name: Rust AST generators

on:
  push:
    paths:
      - ".github/workflows/oxidized-astgen.yml"
      - "astgen-rs/**"
  pull_request:
    paths:
      - ".github/workflows/oxidized-astgen.yml"
      - "astgen-rs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo:
    strategy:
      fail-fast: false
      matrix:
        frontend:
          - abap2cpg
          - csharpsrc2cpg
          - javasrc2cpg
          - jimple2cpg
          - kotlin2cpg
          - php2cpg
          - swiftsrc2cpg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: astgen-rs/${{ matrix.frontend }}
      - name: Check formatting
        run: cargo fmt --all --check
        working-directory: astgen-rs/${{ matrix.frontend }}
      - name: Test
        run: cargo test --workspace --locked
        working-directory: astgen-rs/${{ matrix.frontend }}
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
        working-directory: astgen-rs/${{ matrix.frontend }}

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.0
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          first_lock=true
          for lockfile in astgen-rs/*/Cargo.lock; do
            if [[ "${first_lock}" == true ]]; then
              cargo audit --deny warnings --file "${lockfile}"
              first_lock=false
            else
              cargo audit --deny warnings --no-fetch --file "${lockfile}"
            fi
          done
