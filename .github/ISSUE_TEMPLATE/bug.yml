name: Bug report
description: Report a reproducible problem in Oxidized Joern.
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include vulnerabilities or secrets. Use the private security report instead.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or full commit SHA
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Rust-native cpg CLI
        - Installer
        - Container
        - Build or CI
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include exact commands, a minimal source sample, and observed output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, architecture, and Rust version if building from source.
    validations:
      required: true
