[package]
name = "cpg-analysis"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cpg-core.workspace = true
rayon.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Test fixtures are built with the C frontend (dev-only; no cycle: the
# frontends do not depend on cpg-analysis).
cpg-frontend.workspace = true
cpg-lang-c.workspace = true
# Scala fixtures for the persistence-stitch end-to-end test (generic job configuration
# config.copy(executionUser = ..) shape has no C equivalent).
cpg-lang-ts.workspace = true
