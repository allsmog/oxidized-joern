[workspace]
resolver = "2"
members = [
    "cpg-core",
    "cpg-frontend",
    "cpg-lang-c",
    "cpg-lang-python",
    "cpg-lang-ts",
    "cpg-analysis",
    "cpg-incremental",
    "cpg-cli",
    "joern-parity",
    "conformance",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
cpg-core = { path = "cpg-core" }
cpg-frontend = { path = "cpg-frontend" }
cpg-lang-c = { path = "cpg-lang-c" }
cpg-lang-python = { path = "cpg-lang-python" }
cpg-lang-ts = { path = "cpg-lang-ts" }
cpg-analysis = { path = "cpg-analysis" }
cpg-incremental = { path = "cpg-incremental" }
tree-sitter = "0.26.9"
tree-sitter-c = "0.24.2"
tree-sitter-python = "0.25"
rayon = "1.12.0"
crc32fast = "1.5.0"
tempfile = "3.27.0"
blake3 = "1.8.2"
fs2 = "0.4.3"
regex = "1.12.2"
zstd = "0.13.3"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
